[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega"
version = "0.1.0"
description = "Alpha discovery, event research, and strategy experimentation lab for quant-platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NeoNix-Lab" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# quant-platform core, pinned to a reviewed tag (see omega.platform_link once present).
platform = [
    "quant-platform @ git+https://github.com/NeoNix-Lab/quant-platform@wave-6-live-consumer-data-plane-storage-lifecycle-v1",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
viz = [
    "matplotlib>=3.7.0",
]
notebooks = [
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
]
ml = [
    "lightgbm>=4.0.0",
    "xgboost>=1.7.0",
    "torch>=2.0.0",
]

[project.scripts]
omega = "omega.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs an external catalog/data backend (skipped when not configured)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
