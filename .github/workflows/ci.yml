name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Omega with the platform core and dev tools
        run: python -m pip install --disable-pip-version-check -e ".[platform,dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
