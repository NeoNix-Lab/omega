schema: omega.strategy-spec/v1
name: volatility_breakout_short
version: 1
# Port of the legacy `volatility_breakout` (short side).
features: [momentum_1m_5]
entry:
  direction: short
  rules:
    - {feature: momentum_1m_5, op: "<", value: "-0.003"}
exit:
